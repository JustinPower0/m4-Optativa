<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería Medioambiental - Mollet del Vallès</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="site-header">
      <div class="header-left">
        <img
          src="img/mollet.png"
          alt="Escudo Ayuntamiento de Mollet del Vallès"
        />
        <h1>Ayuntamiento de Mollet del Vallès</h1>
      </div>

      <nav class="menu-right">
        <ul class="menu">
          <li><a href="index1.html">Inicio</a></li>
          <li><a href="index2.html">Contacto</a></li>
          <li><a href="index3.html">Galería</a></li>
          <li><a href="index4.html">Medidas</a></li>
          <li><a href="index5.html">Consejos</a></li>
          <li><a href="index6.html">UE y Agenda 2030</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Paisajes Naturales</h2>

        <div class="galeria">
          <figure>
            <img
              style="width: 500px"
              src="img/gallecs.jpg"
              alt="Espacio Natural de Gallecs"
            />
            <figcaption>
              Espacio Natural de Gallecs, pulmón verde de Mollet del Vallès.
            </figcaption>
          </figure>

          <figure>
            <img
              style="width: 500px"
              src="img/4679_entrada-canmula.jpg"
              alt="Parc de Can Mulà"
            />
            <figcaption>
              Parc de Can Mulà, espacio urbano sostenible.
            </figcaption>
          </figure>
        </div>
      </section>

      <section>
        <h2>Proyectos Ambientales Municipales</h2>

        <div class="galeria">
          <figure>
            <img
              style="width: 500px"
              src="img/Paneles_Solares_Mollet.jpg"
              alt="Paneles solares municipales"
            />
            <figcaption>
              Instalación de paneles solares en edificios públicos.
            </figcaption>
          </figure>

          <figure>
            <img
              style="width: 500px"
              src="img/Puntos_Reciclaje.jpg"
              alt="Puntos de reciclaje"
            />
            <figcaption>
              Puntos de reciclaje distribuidos por la ciudad.
            </figcaption>
          </figure>
        </div>
      </section>

      <section>
        <h2>Eventos de Sostenibilidad</h2>

        <div class="galeria">
          <figure>
            <img
              style="width: 500px"
              src="img/Eventos_Sociales.jpg"
              alt="Jornada de limpieza"
            />
            <figcaption>
              Jornada ciudadana de limpieza de espacios naturales.
            </figcaption>
          </figure>

          <figure>
            <img
              style="width: 500px"
              src="img/Taller_Reciclaje.jpg"
              alt="Taller de reciclaje"
            />
            <figcaption>
              Taller educativo de reciclaje para familias.
            </figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 Ayuntamiento de Mollet del Vallès</p>
    </footer>
  </body>
</html>
